<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Chapter 7 In class</title>
  
   <script src="Timer.js" defer></script>
   <link rel="stylesheet" href="Timer.css" />
    
    </head>
    <body>
        <h2> Countdown</h2>

        <div id="countdownBox">
            <h3> Count Down to Last Day of Classes</h3>
                <p id="currentDay">It is currently: </p>
                <span id="currentTime"></span>



            <div id="timerBox">
                <div id="days">
                    <div class="num" id="daysNum">0</div>
                    <span>days</span>
                </div>
                    
                <div id="hours">
                    <div class="num" id="hoursNum">0</div>
                    <span>hours</span>

                </div>
                    
                <div id="minutes">
                    <div class="num" id="minutesNum">0</div>
                    <span>minutes</span>
                </div>
                    
                <div id="seconds">
                    <div class="num" id="secondsNum">0</div>
                    <span>seconds</span>
                </div>



            </div>





        </div>
       

    </body>
</html>
