<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Exam2.css">
    <title>Web Programming Page Exam 2</title>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
         //retirve the data from the url
        var formData = location.search.slice(1)// grab everything after the ?
        formData = formData.replace(/\+/g, " ");// replace the + with spaces
        formData = decodeURIComponent(formData); // decode the url, ex.%20 -> space
        formFields = formData.split(/[&=]/g); // split into an array of field names and values 
        // adding window.var makes the variable global
        // declare body
        const body = document.getElementsByTagName("body")[0];

        let heading = document.createElement("h1");
        body.appendChild(heading);

        //add text content will update since child has already been appended
        heading.textContent = "Exam 2 Submission";

        console.log(formFields.length);

       let stuff = document.createElement("p");
       body.appendChild(stuff);
    
        stuff.innerHTML += "your first name is " + formFields[1];
        stuff.innerHTML += "<br>";
        stuff.innerHTML += "your last name is " + formFields[3];
        stuff.innerHTML += "<br>";
        stuff.innerHTML += "your email is " + formFields[5];
        stuff.innerHTML += "<br>";
        stuff.innerHTML += "state Selection is " + formFields[7];
        stuff.innerHTML += "<br>";
        
      });
              
   </script> 

</head>

</body>


</html>
