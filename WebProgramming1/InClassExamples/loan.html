<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <link href="loan.css">
    <script src="loan.js" defer></script>
</head>




<body>
    <h1>Loan Calculator</h1>
    <br>
    <label for="interestRate">Interest Rate</label>
    <input type="number" id="interestRate" step="0.01" min=".01" max="1.0" >
    <br>
    <label for="amtBorrowed">Amount Borrowed</label>
    <input type ="number" id="amtBorrowed" step="100">
    <br>
    <label for="numberOfMonths">Number of Months</label>
    <input type="number" id="numberOfMonths">
    <br>
    <!-- <br>
    <label for="numOfCompounds">Number of Compounds</label>
    <input type="number" id="numOfCompounds">
    <br> -->
    <button onclick="calcLoan()">Calculate</button>
    <br><br>

    <p> Your payment is: </p>
    <span id="calculatedLoan">Amount is here</span>


</body>
</html>
